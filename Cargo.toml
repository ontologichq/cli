[package]
name = "ontologic-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "ontologic, the command line for an ontologic engine."
repository = "https://github.com/ontologichq/cli"
publish = false

[[bin]]
name = "ontologic"
path = "src/main.rs"

[dependencies]
# Pinned by revision: kit's sprint-27/ask-log, to be tagged v0.3.0. To work on kit alongside, patch
# it to a local checkout in a gitignored .cargo/config.toml (see README).
ontologic-kit = { git = "https://github.com/ontologichq/kit", rev = "c00e956254d2c32b133b2ce0b5d42ad5bacdb4e7", features = ["client"] }
rustyline = { version = "18", features = ["buffer-redux", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
# The same kit with its fake engine, which tests/cli.rs runs the binary against.
ontologic-kit = { git = "https://github.com/ontologichq/kit", rev = "c00e956254d2c32b133b2ce0b5d42ad5bacdb4e7", features = ["fake"] }

[target.'cfg(unix)'.dev-dependencies]
# A pseudo-terminal, so a test types into the CLI as a person does and sees its history file.
libc = "0.2"
