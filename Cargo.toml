[package]
name = "ontologic-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "ontologic, the command line for an ontologic engine."
repository = "https://github.com/ontologichq/cli"
publish = false

[[bin]]
name = "ontologic"
path = "src/main.rs"

[dependencies]
# Pinned by tag. To work on kit alongside, patch it to a local checkout in a gitignored
# .cargo/config.toml (see README).
ontologic-kit = { git = "https://github.com/ontologichq/kit", tag = "v0.2.1", features = ["client"] }
rustyline = { version = "18", features = ["buffer-redux", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
# The same kit with its fake engine, which tests/cli.rs runs the binary against.
ontologic-kit = { git = "https://github.com/ontologichq/kit", tag = "v0.2.1", features = ["fake"] }
